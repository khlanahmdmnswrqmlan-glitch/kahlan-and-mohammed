<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Progress - رسمات بالـ HTML و CSS</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #0370dd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .canvas-container {
            position: relative;
            width: 900px;
            height: 550px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* تنسيق عام للخطوط البيضاء المضيئة */
        .sketch-line {
            position: absolute;
            fill: none;
            stroke: #981212;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
        }

        /* 1. النص */
        .quote-box {
            position: absolute;
            top: 50px;
            left: 60px;
            color: #d41a1a;
            font-size: 22px;
            font-style: italic;
            font-weight: 300;
            line-height: 1.4;
            max-width: 280px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        /* 2. المصباح */
        .bulb-section {
            position: absolute;
            top: 30px;
            left: 450px;
        }

        /* 3. الكتب والكوب */
        .books-section {
            position: absolute;
            bottom: 70px;
            left: 60px;
        }

        /* 4. النبتة */
        .plant-section {
            position: absolute;
            bottom: 40px;
            right: 100px;
        }
    </style>
</head>
<body>

<div class="canvas-container">

    <!-- النص الموجود في الصورة -->
    <div class="quote-box">
        "Small progress is still progress."
    </div>

    <!-- رسمة المصباح العلوي باستخدام SVG -->
    <div class="bulb-section">
        <svg width="120" height="150" viewBox="0 0 100 130">
            <!-- الأسلاك الموصولة -->
            <path class="sketch-line" d="M50 0 L50 30" />
            <!-- زجاج المصباح -->
            <path class="sketch-line" d="M35 30 Q20 50 25 75 Q30 95 45 100 L55 100 Q70 95 75 75 Q80 50 65 30 Z" />
            <!-- فتيل المصباح الداخلي -->
            <path class="sketch-line" d="M45 100 L45 70 Q50 55 55 70 L55 100" />
            <path class="sketch-line" d="M50 70 L50 50" />
            <!-- قاعدة المصباح -->
            <path class="sketch-line" d="M42 100 L58 100 L55 115 L45 115 Z" />
            <path class="sketch-line" d="M45 115 L55 115 L53 125 L47 125 Z" />
        </svg>
    </div>

    <!-- رسمة الكتب وفوقها الكوب باستخدام SVG -->
    <div class="books-section">
        <svg width="380" height="200" viewBox="0 0 380 200">
            <!-- الكتاب السفلي -->
            <path class="sketch-line" d="M10 140 L220 120 L350 145 L140 170 Z" />
            <path class="sketch-line" d="M10 148 L220 128 L350 153 L140 178 Z" />
            <path class="sketch-line" d="M140 140 L140 170" /> <!-- خط طية الكتيب السفلي -->

            <!-- الكتاب العلوي -->
            <path class="sketch-line" d="M30 95 L200 75 L330 100 L160 125 Z" />
            <path class="sketch-line" d="M30 102 L200 82 L330 107 L160 132 Z" />
            <path class="sketch-line" d="M160 95 L160 125" />

            <!-- صحن الكوب -->
            <path class="sketch-line" d="M130 100 Q180 115 230 100 Q180 90 130 100 Z" />

            <!-- الكوب -->
            <path class="sketch-line" d="M145 65 L215 65 L205 95 C180 100 170 100 155 95 Z" />
            <!-- مقبض الكوب الأيسر والأيمن -->
            <path class="sketch-line" d="M147 70 C130 70 130 90 148 90" />
            <path class="sketch-line" d="M213 70 C230 70 230 90 212 90" />
        </svg>
    </div>

    <!-- رسمة النبتة في الاصيص باستخدام SVG -->
    <div class="plant-section">
        <svg width="180" height="250" viewBox="0 0 180 250">
            <!-- جذع والأوراق المتفرعة -->
            <path class="sketch-line" d="M90 170 L90 70" />
            <path class="sketch-line" d="M90 130 C60 120 30 130 10 110 C30 100 60 110 90 120" />
            <path class="sketch-line" d="M90 100 C120 90 150 100 170 80 C150 70 120 80 90 90" />
            <path class="sketch-line" d="M90 80 C60 60 40 40 20 20 C40 30 60 50 90 70" />
            <path class="sketch-line" d="M90 70 C110 50 130 30 150 10 C130 30 110 50 90 60" />
            <path class="sketch-line" d="M90 50 C90 20 90 20 90 10 C90 20 90 20 90 40" />

            <!-- أصيص الزرع (الوعاء) -->
            <path class="sketch-line" d="M50 160 L130 160 L120 230 L60 230 Z" />
            <!-- حافة الأصيص العلوي -->
            <path class="sketch-line" d="M40 150 L140 150 L135 160 L45 160 Z" />
        </svg>
    </div>

</div>

</body>
</html>
